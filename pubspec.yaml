name: physics_native
description: Fisika Native — belajar matematika offline, UI ala Obsidian (mandiri, tanpa install Obsidian).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18
  webview_flutter: ^4.4.2
  share_plus: ^8.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/content.json
